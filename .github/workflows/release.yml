name: Release

on:
  push:
    tags:
      - 'v*'  # 触发条件：推送 v 开头的 tag（如 v1.0.0）

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest
    permissions:
      contents: write  # 创建 Release 所需权限

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: 从 tag 提取版本号
        id: version
        shell: bash
        run: |
          # 去掉 tag 前缀 v，得到纯版本号
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "当前发布: $TAG (版本 $VERSION)"

      - name: 编译 Release 版本
        run: cargo build --release --locked

      - name: 打包产物
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $staging = "MeowCanvas-$tag-windows-x64"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          # 复制可执行文件
          Copy-Item "target/release/meowcanvas.exe" -Destination "$staging/"
          # 复制前端资源（如需外部加载，rust-embed 已嵌入则可省略）
          # 压缩为 zip
          Compress-Archive -Path "$staging/*" -DestinationPath "$staging.zip" -Force
          Write-Host "打包完成: $staging.zip"
          Get-Item "$staging.zip" | Select-Object Name, Length

      - name: 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MeowCanvas ${{ steps.version.outputs.tag }}
          body: |
            # MeowCanvas ${{ steps.version.outputs.tag }}

            ## 下载安装

            1. 下载下方 `MeowCanvas-${{ steps.version.outputs.tag }}-windows-x64.zip`
            2. 解压后运行 `meowcanvas.exe`
            3. 应用会自动启动本地服务并打开桌面窗口

            ## 系统要求

            - Windows 10 及以上（需预装 WebView2 运行时，Win10/11 通常已内置）

            ## 说明

            - 数据持久化在运行目录的 `data/` 文件夹
            - 前端资源已通过 rust-embed 嵌入可执行文件
          files: MeowCanvas-${{ steps.version.outputs.tag }}-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
