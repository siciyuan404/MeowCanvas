[package]
name = "meowcanvas"
version = "1.0.0"
edition = "2021"
description = "MeowCanvas - 无限画布 (Rust 复刻 Infinite-Canvas)"
authors = ["MeowCanvas"]

[dependencies]
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
wry = "0.45"
tao = "0.30"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
